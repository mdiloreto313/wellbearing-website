<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Return to Well-Bearing</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f7f9f7;
      color: #24312d;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }
    main { max-width: 28rem; text-align: center; }
    h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.02em; margin-bottom: 12px; }
    p { color: #4a5a54; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: #2f6b4f;
      color: #fff;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Return to Well-Bearing</h1>
    <p>If Well-Bearing is installed, return to the app to continue signing in.</p>
    <a href="wellbearing://auth/callback">Open Well-Bearing</a>
  </main>
  <script>
    (function () {
      try {
        if (window.location.search || window.location.hash) {
          window.history.replaceState(null, "", "/auth/callback");
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
